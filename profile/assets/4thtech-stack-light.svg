<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
<title id="t">The 4thTech stack</title>
<desc id="d">Two tiers. Production-ready: white-label UIs for mail, chat and file transfer and the Encryptor extension, on the 4thTech SDK, on the OCC v1 smart contracts, on any EVM chain with PollinationX storage. Early stage: the AgentLink apps and MCP server for AI apps, on the AgentLink libraries, on the OCC v2 protocol, over free public relays, an encrypted drop and test networks for proof. Research and experiments sit on top of both.</desc>
